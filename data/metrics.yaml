  - name: reclaim_filed_rate_pct
    tenant: harborline
    domain: Tax Reclaim
    sentiment: positive
    grain: Share of reclaim-eligible income payments for which a reclaim was filed, over the full history.
    tables:
      - harborline.cae_income_payment
    description: |
      Of income payments eligible for a withholding-tax reclaim, the percentage Harborline actually
      filed. About 60% overall, and far lower in HIGH-complexity markets (FR, IT, CH): the unfiled rest is
      client value leakage (POL-005 section 4).
    formula: |
      SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE reclaim_filed) / COUNT(*), 2)
      FROM harborline.cae_income_payment
      WHERE reclaim_eligible
    dimensions_allowed:
      - dim_market.market_code
      - dim_market.tax_reclaim_complexity
      - dim_client.client_segment
    synonyms: [reclaim filing rate, tax reclaim filed, reclaims filed percentage, withholding tax reclaim rate, reclaim success rate]
    definition_owner: Tax Services
    format: percentage
