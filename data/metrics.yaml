  # ── Cross-area ──

  - name: counterparty_fail_cash_impact
    tenant: harborline
    domain: Cross-area
    sentiment: negative
    grain: One row per counterparty and client - penalties plus allocated overdraft funding cost from failed receives, USD.
    tables:
      - harborline.stl_trade_instruction
      - harborline.stl_fail_penalty
      - harborline.pos_cash_balance
      - harborline.dim_counterparty
      - harborline.dim_client
    description: |
      Cash cost of counterparty fails, chaining fails to penalties to overdraft funding cost. Penalties
      are summed directly per counterparty and client. A client's overdraft funding cost is allocated across
      its counterparties in proportion to the USD value of that counterparty's FAILED RECEIVE instructions
      for the client (failed receives are the main overdraft cause, POL-011 section 2). An allocation, not an
      observed link: the data has no instruction-to-overdraft key.
    formula: |
      WITH fr AS (SELECT client_key, counterparty_key, SUM(settlement_amount_usd) AS v
                  FROM harborline.stl_trade_instruction
                  WHERE direction = 'RECEIVE' AND settlement_status = 'FAILED' GROUP BY client_key, counterparty_key),
           frt AS (SELECT client_key, SUM(v) AS tv FROM fr GROUP BY client_key),
           fund AS (SELECT client_key, SUM(funding_cost_usd) AS funding FROM harborline.pos_cash_balance GROUP BY client_key),
           pen AS (SELECT client_key, counterparty_key, SUM(penalty_amount_usd) AS penalties
                   FROM harborline.stl_fail_penalty GROUP BY client_key, counterparty_key),
           alloc AS (SELECT fr.client_key, fr.counterparty_key, fund.funding * fr.v / frt.tv AS funding_alloc
                     FROM fr JOIN frt USING (client_key) JOIN fund USING (client_key))
      SELECT cp.counterparty_name, cp.reliability_tier, c.client_name,
             ROUND(COALESCE(pen.penalties, 0), 2) AS penalties_usd,
             ROUND(COALESCE(alloc.funding_alloc, 0), 2) AS allocated_funding_cost_usd,
             ROUND(COALESCE(pen.penalties, 0) + COALESCE(alloc.funding_alloc, 0), 2) AS total_cash_impact_usd
      FROM pen
      FULL OUTER JOIN alloc USING (client_key, counterparty_key)
      JOIN harborline.dim_counterparty cp USING (counterparty_key)
      JOIN harborline.dim_client c USING (client_key)
      ORDER BY total_cash_impact_usd DESC
    dimensions_allowed:
      - dim_counterparty.reliability_tier
      - dim_client.sla_tier
    synonyms: [cost of counterparty fails, counterparty fail cost, which counterparties cost us most, fails to penalties to overdrafts, counterparty cash impact, fail-driven overdraft cost]
    definition_owner: Operational Risk
    format: currency
    policy_refs: [POL-007#3, POL-011#2]
    example_questions:
      - "Which counterparties cost us the most in penalties and overdraft funding?"
      - "What do tier D counterparties cost each client?"

  - name: client_sla_settlement_compliance
    tenant: harborline
    domain: Cross-area
    sentiment: positive
    grain: One row per client per calendar month - settlement rate vs the client's SLA tier target (POL-001 section 2).
    tables:
      - harborline.stl_trade_instruction
      - harborline.dim_client
      - harborline.dim_date
    description: |
      Monthly settlement rate per client against the contractual target for its SLA tier: PLATINUM 99.0%,
      GOLD 98.0%, SILVER 97.0% (POL-001 section 2). Settlement rate = instructions settled on the intended
      date / (SETTLED + FAILED instructions) in the month of the intended date. met_target is false for a
      breach. The flagship hybrid metric: combines data with a policy threshold.
    formula: |
      SELECT c.client_name, c.sla_tier, d.year_num, d.month_num,
             COUNT(*) AS instructions,
             ROUND(100.0 * COUNT(*) FILTER (WHERE i.actual_settle_date_key = i.intended_settle_date_key) / COUNT(*), 2) AS settlement_rate_pct,
             CASE c.sla_tier WHEN 'PLATINUM' THEN 99.0 WHEN 'GOLD' THEN 98.0 ELSE 97.0 END AS target_pct,
             100.0 * COUNT(*) FILTER (WHERE i.actual_settle_date_key = i.intended_settle_date_key) / COUNT(*)
               >= CASE c.sla_tier WHEN 'PLATINUM' THEN 99.0 WHEN 'GOLD' THEN 98.0 ELSE 97.0 END AS met_target
      FROM harborline.stl_trade_instruction i
      JOIN harborline.dim_client c ON c.client_key = i.client_key
      JOIN harborline.dim_date d ON d.date_key = i.intended_settle_date_key
      WHERE i.settlement_status IN ('SETTLED', 'FAILED')
      GROUP BY c.client_name, c.sla_tier, d.year_num, d.month_num
      ORDER BY d.year_num, d.month_num, c.client_name
    dimensions_allowed:
      - dim_client.sla_tier
      - dim_date.year_num
      - dim_date.month_num
    synonyms: [SLA compliance, settlement SLA, clients missing settlement target, SLA settlement target, which clients breached settlement SLA, tier target settlement rate, platinum clients missing target]
    definition_owner: Client Service
    format: percentage
    policy_refs: [POL-001#2, POL-001#4]
    example_questions:
      - "Which PLATINUM clients missed their settlement SLA target last month?"
      - "Which clients met their settlement target in September 2026?"
