  - name: unfiled_reclaim_value_usd
    tenant: harborline
    domain: Tax Reclaim
    sentiment: negative
    grain: USD value of eligible but unfiled tax reclaims over the full history.
    tables:
      - harborline.cae_income_payment
    description: |
      Total recoverable withholding tax on income payments that were reclaim-eligible but not filed:
      the headline leakage figure. Clients with more than USD 500,000 unfiled are escalated (POL-005
      section 8). Statute deadlines all fall in 2028 or later in this data window.
    formula: |
      SELECT ROUND(SUM(reclaim_amount_usd), 2)
      FROM harborline.cae_income_payment
      WHERE reclaim_eligible AND NOT reclaim_filed
    dimensions_allowed:
      - dim_market.market_code
      - dim_market.tax_reclaim_complexity
      - dim_client.client_name
      - dim_client.client_segment
    synonyms: [tax reclaim leakage, unfiled reclaims, unclaimed withholding tax, reclaim leakage value, money left on the table, unfiled tax reclaim value]
    definition_owner: Tax Services
    format: currency
    policy_refs: [POL-005#8]
    example_questions:
      - "How much tax reclaim value is unfiled?"
      - "Unfiled reclaims by market"

