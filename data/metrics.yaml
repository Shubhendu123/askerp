  - name: client_profitability_usd
    tenant: harborline
    domain: Client & Billing
    sentiment: positive
    grain: One row per client - cost-to-serve profitability in USD over the full invoiced history.
    tables:
      - harborline.dim_client
      - harborline.clt_fee_invoice
      - harborline.stl_fail_penalty
      - harborline.pos_cash_balance
      - harborline.clt_service_request
    description: |
      Client profitability per POL-010 section 6: invoiced revenue minus (penalties borne by Harborline
      for the client's instructions, plus overdraft funding cost not recovered through OVERDRAFT fees,
      plus SLA credits, plus service-request analyst hours at USD 85 per hour). Computed here over the
      whole history per client (policy reviews it quarterly). Negative values are loss-making clients.
    formula: |
      WITH rev AS (SELECT client_key, SUM(invoiced_amount_usd) AS invoiced,
                          SUM(billable_amount_usd - invoiced_amount_usd) FILTER (WHERE waiver_reason = 'SLA_CREDIT') AS sla_credits,
                          SUM(invoiced_amount_usd) FILTER (WHERE fee_type = 'OVERDRAFT') AS overdraft_fees
                   FROM harborline.clt_fee_invoice GROUP BY client_key),
           pen AS (SELECT client_key, SUM(penalty_amount_usd) AS penalties
                   FROM harborline.stl_fail_penalty WHERE bearer = 'HARBORLINE' GROUP BY client_key),
           fund AS (SELECT client_key, SUM(funding_cost_usd) AS funding FROM harborline.pos_cash_balance GROUP BY client_key),
           svc AS (SELECT client_key, SUM(analyst_hours) * 85 AS service_cost FROM harborline.clt_service_request GROUP BY client_key)
      SELECT c.client_name, c.sla_tier,
             ROUND(COALESCE(rev.invoiced, 0)
                   - COALESCE(pen.penalties, 0)
                   - GREATEST(COALESCE(fund.funding, 0) - COALESCE(rev.overdraft_fees, 0), 0)
                   - COALESCE(rev.sla_credits, 0)
                   - COALESCE(svc.service_cost, 0), 2) AS profitability_usd
      FROM harborline.dim_client c
      LEFT JOIN rev USING (client_key) LEFT JOIN pen USING (client_key)
      LEFT JOIN fund USING (client_key) LEFT JOIN svc USING (client_key)
      ORDER BY profitability_usd
    dimensions_allowed:
      - dim_client.client_segment
      - dim_client.sla_tier
    synonyms: [client profitability, cost to serve, unprofitable clients, loss-making clients, client margin, negative profitability clients, which clients lose money]
    definition_owner: Product and Pricing
    format: currency
    policy_refs: [POL-010#6]
    example_questions:
      - "Which clients are unprofitable under our cost-to-serve definition?"
      - "Client profitability ranking"

