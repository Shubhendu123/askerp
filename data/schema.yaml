tables:
- name: dim_customer
  tenant: northwind
  type: dimension
  description: Customers of Northwind Furniture — companies that purchase office and
    industrial furniture in bulk.
  columns:
  - name: customer_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each customer account.
  - name: customer_name
    type: VARCHAR
    description: Legal name of the customer organization.
  - name: customer_segment
    type: VARCHAR
    description: 'Size-based sales segment: Enterprise, Mid-Market, or SMB.'
    values:
    - Enterprise
    - Mid-Market
    - SMB
  - name: industry
    type: VARCHAR
    description: The vertical market the customer operates in (e.g., Hospitality,
      Healthcare).
    values:
    - Hospitality
    - Healthcare
    - Education
    - Corporate
    - Government
    - Retail
  - name: region
    type: VARCHAR
    description: 'US sales region the customer belongs to: West, East, Central, or
      South.'
    values:
    - West
    - East
    - Central
    - South
  - name: state
    type: VARCHAR
    description: Two-letter US state code where the customer is headquartered.
  - name: city
    type: VARCHAR
    description: City where the customer is headquartered.
  - name: credit_limit
    type: DECIMAL
    description: Maximum outstanding balance (in USD) Northwind will extend to this
      customer.
  - name: payment_terms
    type: VARCHAR
    description: 'Agreed payment window for invoices: Net 15, Net 30, Net 45, or Net
      60.'
    values:
    - Net 15
    - Net 30
    - Net 45
    - Net 60
  - name: account_manager_id
    type: INTEGER
    foreign_key: dim_employee.employee_id
    description: The Northwind sales employee assigned to manage this customer relationship.
  - name: created_date
    type: DATE
    description: Date the customer account was first created in the system.
  - name: status
    type: VARCHAR
    description: 'Current account standing: Active (buying), Inactive (dormant), or
      Churned (lost).'
    values:
    - Active
    - Inactive
    - Churned
- name: dim_item
  tenant: northwind
  type: dimension
  description: Product catalog of furniture items sold by Northwind Furniture.
  columns:
  - name: item_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each product in the catalog.
  - name: sku
    type: VARCHAR
    description: Alphanumeric stock-keeping unit code used for inventory and ordering.
  - name: item_name
    type: VARCHAR
    description: Full product name as shown on quotes and invoices.
  - name: category
    type: VARCHAR
    description: Top-level product category (e.g., Office Seating, Conference Tables).
    values:
    - Office Seating
    - Office Desks
    - Conference Tables
    - Outdoor Furniture
    - Storage
    - Lighting
  - name: subcategory
    type: VARCHAR
    description: More specific product grouping within a category (e.g., Executive
      Chairs, Standing Desks).
  - name: material
    type: VARCHAR
    description: Primary material the item is made from.
    values:
    - Wood
    - Metal
    - Plastic
    - Upholstered
    - Mixed
  - name: unit_cost
    type: DECIMAL
    description: What it costs Northwind to produce or acquire one unit of this item
      (in USD).
  - name: unit_price
    type: DECIMAL
    description: Standard list price charged to customers for one unit (in USD).
  - name: supplier
    type: VARCHAR
    description: Name of the external vendor or manufacturer that supplies this item.
  - name: lead_time_days
    type: INTEGER
    description: Number of days from order placement to item availability (manufacturing
      + shipping).
  - name: status
    type: VARCHAR
    description: Whether the item is currently sold (Active) or no longer offered
      (Discontinued).
    values:
    - Active
    - Discontinued
- name: dim_employee
  tenant: northwind
  type: dimension
  description: Northwind Furniture sales team members, including reps, managers, and
    VPs.
  columns:
  - name: employee_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each employee.
  - name: employee_name
    type: VARCHAR
    description: Full name of the employee.
  - name: role
    type: VARCHAR
    description: 'Job title within the sales hierarchy: Sales Rep, Sales Manager,
      or VP Sales.'
    values:
    - Sales Rep
    - Sales Manager
    - VP Sales
  - name: region
    type: VARCHAR
    description: The US sales territory this employee is responsible for. National
      applies to VP-level roles.
    values:
    - West
    - East
    - Central
    - South
    - National
  - name: manager_id
    type: INTEGER
    nullable: true
    foreign_key: dim_employee.employee_id
    description: employee_id of this person's direct manager. Null for the top of
      the hierarchy.
  - name: hire_date
    type: DATE
    description: Date the employee joined Northwind Furniture.
  - name: status
    type: VARCHAR
    description: Whether the employee is currently employed (Active) or has left (Inactive).
    values:
    - Active
    - Inactive
- name: dim_location
  tenant: northwind
  type: dimension
  description: Physical locations operated by Northwind Furniture, including warehouses,
    showrooms, and HQ.
  columns:
  - name: location_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each Northwind facility.
  - name: location_name
    type: VARCHAR
    description: Descriptive name of the facility (e.g., Dallas Distribution Center).
  - name: location_type
    type: VARCHAR
    description: 'Type of facility: Warehouse (fulfillment), Showroom (sales), or
      HQ (headquarters).'
    values:
    - Warehouse
    - Showroom
    - HQ
  - name: region
    type: VARCHAR
    description: US sales region this location serves.
    values:
    - West
    - East
    - Central
    - South
  - name: state
    type: VARCHAR
    description: Two-letter US state code where this facility is located.
  - name: city
    type: VARCHAR
    description: City where this facility is located.
  - name: capacity_units
    type: INTEGER
    description: Maximum number of furniture units this location can store at one
      time.
- name: dim_date
  tenant: northwind
  type: dimension
  description: Calendar date dimension covering all dates relevant to Northwind's
    transaction history.
  columns:
  - name: date_id
    type: INTEGER
    primary_key: true
    description: Date key in YYYYMMDD format (e.g., 20240315 for March 15, 2024).
  - name: date
    type: DATE
    description: The actual calendar date.
  - name: day_of_week
    type: VARCHAR
    description: Full name of the day (e.g., Monday, Tuesday).
  - name: day_of_month
    type: INTEGER
    description: Numeric day within the month, from 1 to 31.
  - name: month
    type: INTEGER
    description: Numeric month of the year, from 1 (January) to 12 (December).
  - name: month_name
    type: VARCHAR
    description: Full name of the month (e.g., January, February).
  - name: quarter
    type: INTEGER
    description: 'Fiscal/calendar quarter: 1, 2, 3, or 4.'
  - name: year
    type: INTEGER
    description: Four-digit calendar year (e.g., 2024).
  - name: is_weekend
    type: BOOLEAN
    description: True if the date falls on a Saturday or Sunday.
  - name: is_holiday
    type: BOOLEAN
    description: True if the date is a US federal holiday.
- name: fact_sales_order
  tenant: northwind
  type: fact
  description: One row per sales order placed by a customer. The primary transactional
    record for revenue tracking.
  columns:
  - name: order_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each sales order.
  - name: order_date_id
    type: INTEGER
    foreign_key: dim_date.date_id
    description: Date the order was placed, as a key into the date dimension (YYYYMMDD).
  - name: customer_id
    type: INTEGER
    foreign_key: dim_customer.customer_id
    description: The customer who placed this order.
  - name: employee_id
    type: INTEGER
    foreign_key: dim_employee.employee_id
    description: The sales rep credited with closing this order.
  - name: location_id
    type: INTEGER
    foreign_key: dim_location.location_id
    description: The warehouse or facility responsible for fulfilling this order.
  - name: order_status
    type: VARCHAR
    description: 'Current lifecycle stage of the order: Pending, Confirmed, Shipped,
      Delivered, or Cancelled.'
    values:
    - Pending
    - Confirmed
    - Shipped
    - Delivered
    - Cancelled
  - name: total_amount
    type: DECIMAL
    description: Total value of the order in USD, summing all line items before tax.
  - name: line_count
    type: INTEGER
    description: Number of distinct product lines included in this order.
  - name: primary_item_category
    type: VARCHAR
    description: Category of the primary (first) item in the order — used to attribute
      margin and anomaly analysis to a product category.
  - name: effective_unit_cost
    type: DECIMAL
    description: Effective unit cost at the time of the order, accounting for cost
      fluctuations over time (e.g., Outdoor Furniture quarterly cost escalation in
      2025).
  - name: effective_gross_margin_pct
    type: DECIMAL
    description: Gross margin percentage at the time of the order ((price - cost)
      / price × 100), reflecting period-specific cost fluctuations.
- name: fact_invoice
  tenant: northwind
  type: fact
  description: One row per invoice issued to a customer. Invoices are generated from
    confirmed sales orders.
  columns:
  - name: invoice_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each invoice.
  - name: order_id
    type: INTEGER
    foreign_key: fact_sales_order.order_id
    description: The sales order this invoice was generated from.
  - name: invoice_date_id
    type: INTEGER
    foreign_key: dim_date.date_id
    description: Date the invoice was issued, as a key into the date dimension (YYYYMMDD).
  - name: due_date_id
    type: INTEGER
    foreign_key: dim_date.date_id
    description: Payment due date based on the customer's payment terms, as a key
      into the date dimension.
  - name: customer_id
    type: INTEGER
    foreign_key: dim_customer.customer_id
    description: The customer this invoice was billed to.
  - name: invoice_amount
    type: DECIMAL
    description: Total invoice value in USD, before tax.
  - name: tax_amount
    type: DECIMAL
    description: Sales tax applied to this invoice in USD.
  - name: status
    type: VARCHAR
    description: 'Current payment status: Open (awaiting payment), Paid, Overdue,
      or Voided.'
    values:
    - Open
    - Paid
    - Overdue
    - Voided
- name: fact_payment
  tenant: northwind
  type: fact
  description: One row per payment received from a customer against an invoice.
  columns:
  - name: payment_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each payment transaction.
  - name: invoice_id
    type: INTEGER
    foreign_key: fact_invoice.invoice_id
    description: The invoice this payment is being applied to.
  - name: payment_date_id
    type: INTEGER
    foreign_key: dim_date.date_id
    description: Date the payment was received, as a key into the date dimension (YYYYMMDD).
  - name: customer_id
    type: INTEGER
    foreign_key: dim_customer.customer_id
    description: The customer who made this payment.
  - name: payment_amount
    type: DECIMAL
    description: Amount received in this payment transaction, in USD.
  - name: payment_method
    type: VARCHAR
    description: 'How the customer paid: Wire transfer, ACH, Check, or Credit Card.'
    values:
    - Wire
    - ACH
    - Check
    - Credit Card
- name: fact_gl_entry
  tenant: northwind
  type: fact
  description: General ledger journal entries recording the financial impact of all
    transactions. The accounting source of truth.
  columns:
  - name: gl_entry_id
    type: INTEGER
    primary_key: true
    description: Unique identifier for each general ledger entry.
  - name: posting_date_id
    type: INTEGER
    foreign_key: dim_date.date_id
    description: Date this entry was posted to the ledger, as a key into the date
      dimension (YYYYMMDD).
  - name: account_code
    type: VARCHAR
    description: Chart of accounts code and label (e.g., 4000-Revenue, 5000-COGS,
      1200-AR).
  - name: account_type
    type: VARCHAR
    description: 'High-level accounting classification for the account: Revenue, COGS,
      Asset, Liability, or Expense.'
    values:
    - Revenue
    - COGS
    - Asset
    - Liability
    - Expense
  - name: debit_amount
    type: DECIMAL
    description: Amount debited in this entry in USD. Zero if this is a credit-only
      entry.
  - name: credit_amount
    type: DECIMAL
    description: Amount credited in this entry in USD. Zero if this is a debit-only
      entry.
  - name: source_type
    type: VARCHAR
    description: 'What business event generated this entry: an Invoice, a Payment,
      or a manual Adjustment.'
    values:
    - Invoice
    - Payment
    - Adjustment
  - name: source_id
    type: INTEGER
    description: The ID of the originating record — references invoice_id or payment_id
      depending on source_type.
# ── MRO Distributor (Tenant 2) — schema mro_distributor, 20 tables (D-029..D-031) ──
- name: dim_date
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per calendar date, 2024-07-01 through the end of loaded history (18 months).
  description: Calendar date dimension for the MRO Distributor tenant. Conformed
    date spine joined by every fact table via date keys in YYYYMMDD form. Query
    as mro_distributor.dim_date.
  columns:
  - name: date_key
    type: INTEGER
    primary_key: true
    description: Date key in YYYYMMDD format (e.g., 20250315 for March 15, 2025).
  - name: full_date
    type: DATE
    description: The actual calendar date.
  - name: day_of_week
    type: VARCHAR
    description: Full name of the day (e.g., Monday, Tuesday).
  - name: day_of_month
    type: INTEGER
    description: Numeric day within the month, from 1 to 31.
  - name: week_of_year
    type: INTEGER
    description: ISO week number within the year.
  - name: month_num
    type: INTEGER
    description: Numeric month of the year, from 1 (January) to 12 (December).
  - name: month_name
    type: VARCHAR
    description: Full name of the month (e.g., January, February).
  - name: quarter_num
    type: INTEGER
    description: 'Calendar quarter: 1, 2, 3, or 4.'
  - name: fiscal_period
    type: VARCHAR
    description: Fiscal period label in FYyy-Qn form (e.g., FY25-Q3). Fiscal year
      equals calendar year.
  - name: year_num
    type: INTEGER
    description: Four-digit calendar year (e.g., 2025).
  - name: is_month_end
    type: BOOLEAN
    description: True if this date is the last day of its month.
- name: dim_subsidiary
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per legal entity (3 subsidiaries).
  description: Legal entities of the MRO distributor group — two US subsidiaries
    and one Canadian, rolling up to MRO Holdings. Every fact row carries a
    subsidiary key, mirroring NetSuite's subsidiary-on-every-transaction pattern.
    Query as mro_distributor.dim_subsidiary.
  columns:
  - name: subsidiary_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each subsidiary.
  - name: subsidiary_name
    type: VARCHAR
    description: Legal entity name (e.g., MRO Distribution US).
  - name: country
    type: VARCHAR
    description: Country of incorporation, USA or Canada.
    values:
    - USA
    - Canada
  - name: currency
    type: VARCHAR
    description: Functional currency. Single-currency deployment — always USD.
  - name: parent_rollup
    type: VARCHAR
    description: Consolidation parent all subsidiaries roll up to (MRO Holdings).
- name: dim_item
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per SKU (~1,200 active SKUs).
  description: Product catalog of the MRO distributor — fasteners, tools, safety,
    electrical, and MRO consumables sold to industrial customers. Categories carry
    deliberately different cost and margin profiles (Fasteners thinnest margin,
    MRO consumables richest). Query as mro_distributor.dim_item.
  columns:
  - name: item_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each SKU.
  - name: sku
    type: VARCHAR
    description: Stock-keeping unit code (e.g., SKU-00042).
  - name: item_name
    type: VARCHAR
    description: Product display name.
  - name: category
    type: VARCHAR
    description: 'Top-level product category. Margin bands differ by category:
      Fasteners ~22% gross margin, Electrical ~28%, Safety ~35%, Tools ~36%,
      MRO ~43%.'
    values:
    - Fasteners
    - Tools
    - Safety
    - Electrical
    - MRO
  - name: subcategory
    type: VARCHAR
    description: More specific grouping within a category (e.g., Bolts, Power
      Tools, PPE, Wire, Lubricants).
  - name: unit_cost
    type: DECIMAL
    description: Standard acquisition cost per unit in USD.
  - name: list_price
    type: DECIMAL
    description: Standard selling price per unit in USD.
  - name: lead_time_class
    type: VARCHAR
    description: 'Replenishment lead-time bucket: Short, Medium, or Long.'
    values:
    - Short
    - Medium
    - Long
  - name: is_active
    type: BOOLEAN
    description: Whether the SKU is currently stocked and sold.
- name: dim_customer
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per customer account (200 B2B customers).
  description: B2B customers of the MRO distributor — manufacturers, construction
    firms, facilities managers, and government buyers. Revenue is deliberately
    concentrated (top 20% of customers ≈ 63% of revenue). Payment behavior varies
    by account — a minority of chronic slow payers drives receivables risk.
    Query as mro_distributor.dim_customer.
  columns:
  - name: customer_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each customer account.
  - name: customer_name
    type: VARCHAR
    description: Customer organization name.
  - name: segment
    type: VARCHAR
    description: 'Vertical market segment: Manufacturing, Construction, Facilities,
      or Government.'
    values:
    - Manufacturing
    - Construction
    - Facilities
    - Government
  - name: region
    type: VARCHAR
    description: North American sales region the customer belongs to.
    values:
    - Midwest
    - South
    - Southeast
    - West
    - Northeast
  - name: credit_terms
    type: VARCHAR
    description: 'Agreed payment window for invoices: Net 30, Net 45, or Net 60.'
    values:
    - Net 30
    - Net 45
    - Net 60
  - name: credit_days
    type: INTEGER
    description: Numeric form of credit_terms (30, 45, or 60 days) for date math
      against payment dates.
- name: dim_supplier
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per supplier (100 suppliers).
  description: Suppliers the distributor buys from. Spend is Pareto-concentrated
    (top 20% of suppliers ≈ 75% of spend). reliability_tier is the planted causal
    signal — tier A suppliers deliver on time while tier D suppliers run chronically
    late, driving stockouts, slower fulfillment, and ultimately slower cash
    collection. Questions about supplier performance, delivery problems, or supply
    risk resolve through this table. Query as mro_distributor.dim_supplier.
  columns:
  - name: supplier_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each supplier.
  - name: supplier_name
    type: VARCHAR
    description: Supplier organization name.
  - name: region
    type: VARCHAR
    description: Supplier region, including offshore import lanes (Import-APAC,
      Import-EU).
  - name: payment_terms
    type: VARCHAR
    description: 'Payment terms the distributor owes the supplier: Net 30, Net 45,
      or Net 60.'
    values:
    - Net 30
    - Net 45
    - Net 60
  - name: payment_days
    type: INTEGER
    description: Numeric form of payment_terms (30, 45, or 60 days).
  - name: promised_lead_days
    type: INTEGER
    description: Contractual delivery lead time in days from PO placement (7, 14,
      21, or 30).
  - name: reliability_tier
    type: VARCHAR
    description: 'Delivery reliability grade, A (reliable) through D (chronically
      late). Mean lateness by tier: A ≈ 0.5 days, B ≈ 2.5, C ≈ 8, D ≈ 16. The
      primary driver of stockouts and fulfillment delay.'
    values:
    - A
    - B
    - C
    - D
- name: dim_warehouse
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per stocking location (4 warehouses).
  description: Distribution centers and branches that stock inventory and fulfill
    orders — two large DCs (Chicago, Dallas) and two branches (Atlanta, Reno).
    Query as mro_distributor.dim_warehouse.
  columns:
  - name: warehouse_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each warehouse.
  - name: warehouse_name
    type: VARCHAR
    description: Facility name (e.g., Chicago DC).
  - name: region
    type: VARCHAR
    description: Region the facility serves.
    values:
    - Midwest
    - South
    - Southeast
    - West
  - name: warehouse_type
    type: VARCHAR
    description: 'Facility class: DC (large distribution center) or Branch
      (smaller stocking branch).'
    values:
    - DC
    - Branch
- name: dim_gl_account
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per general ledger account (8-account chart).
  description: Chart of accounts for the MRO tenant — Revenue, COGS, AR, AP,
    Inventory, Operating Expense, Cash, and Retained Earnings. Journal lines and
    period balances reference these accounts. Query as
    mro_distributor.dim_gl_account.
  columns:
  - name: gl_account_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each GL account.
  - name: account_code
    type: VARCHAR
    description: Numeric account code (e.g., 4000 for Revenue, 5000 for COGS).
  - name: account_name
    type: VARCHAR
    description: Account name (Revenue, COGS, Accounts Receivable, Accounts
      Payable, Inventory, Operating Expense, Cash, Retained Earnings).
  - name: account_type
    type: VARCHAR
    description: 'Accounting classification: Asset, Liability, Equity, Revenue,
      or Expense.'
    values:
    - Asset
    - Liability
    - Equity
    - Revenue
    - Expense
  - name: statement
    type: VARCHAR
    description: Which financial statement the account reports on — P&L or BS
      (balance sheet).
    values:
    - P&L
    - BS
  - name: rollup
    type: VARCHAR
    description: Statement rollup grouping (e.g., Income, Current Assets, Current
      Liab, Equity).
- name: dim_employee
  tenant: mro
  schema: mro_distributor
  type: dimension
  grain: One row per employee (30 employees).
  description: Sales reps who own customer orders and buyers who place purchase
    orders with suppliers. Query as mro_distributor.dim_employee.
  columns:
  - name: employee_key
    type: INTEGER
    primary_key: true
    description: Unique identifier for each employee.
  - name: employee_name
    type: VARCHAR
    description: Full name of the employee.
  - name: role
    type: VARCHAR
    description: 'Job function: Sales Rep (owns customer orders) or Buyer (owns
      purchase orders).'
    values:
    - Sales Rep
    - Buyer
  - name: region
    type: VARCHAR
    description: Region the employee covers.
- name: o2c_sales_order_line
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per sales order line. Each order in this dataset has exactly one
    line, so line-level and order-level aggregates coincide.
  description: Order-to-Cash sales order lines — the revenue backbone of the MRO
    tenant. Carries both the selling side (unit_price, ext_amount) and the cost
    side (unit_cost, ext_cost, margin_amount) so revenue, COGS, and gross margin
    all compute from this one table. Roughly $298M annualized revenue with ~8%
    YoY growth and a Q4 seasonal uplift. Query as
    mro_distributor.o2c_sales_order_line.
  columns:
  - name: so_line_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each sales order line.
  - name: so_number
    type: VARCHAR
    description: Human-readable sales order number (e.g., SO-000123).
  - name: order_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the order was placed (YYYYMMDD key into dim_date).
  - name: customer_key
    type: INTEGER
    foreign_key: mro_distributor.dim_customer.customer_key
    description: The customer who placed the order.
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU ordered.
  - name: warehouse_key
    type: INTEGER
    foreign_key: mro_distributor.dim_warehouse.warehouse_key
    description: Warehouse assigned to fulfill the line.
  - name: employee_key
    type: INTEGER
    foreign_key: mro_distributor.dim_employee.employee_key
    description: Sales rep credited with the order.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity the order books to.
  - name: qty_ordered
    type: INTEGER
    description: Units ordered on this line.
  - name: unit_price
    type: DECIMAL
    description: Selling price per unit in USD.
  - name: ext_amount
    type: DECIMAL
    description: Extended selling amount (unit_price × qty_ordered) — the revenue
      value of the line.
  - name: unit_cost
    type: DECIMAL
    description: Cost per unit at time of order in USD.
  - name: ext_cost
    type: DECIMAL
    description: Extended cost (unit_cost × qty_ordered) — the COGS value of the
      line.
  - name: margin_amount
    type: DECIMAL
    description: Gross margin dollars on the line (ext_amount − ext_cost).
  - name: promised_ship_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Customer-promised ship date (order date + lead-time-class offset,
      YYYYMMDD key). The OTIF baseline — a line is on time when shipped on or
      before this date.
- name: o2c_fulfillment_line
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per shipped order line (orders still unshipped at end of history
    have no row).
  description: Order-to-Cash fulfillments — when each order line actually shipped.
    order_to_ship_days is the fulfillment speed measure and a key link in the
    supplier→cash causal chain — items sourced from unreliable (tier C/D) suppliers
    stock out more and ship days later. Invoices are issued at ship date, so slow
    fulfillment directly delays billing and cash. Query as
    mro_distributor.o2c_fulfillment_line.
  columns:
  - name: ff_line_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each fulfillment line.
  - name: so_line_key
    type: BIGINT
    foreign_key: mro_distributor.o2c_sales_order_line.so_line_key
    description: The sales order line this fulfillment ships.
  - name: ship_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the line shipped (YYYYMMDD key into dim_date).
  - name: customer_key
    type: INTEGER
    foreign_key: mro_distributor.dim_customer.customer_key
    description: Customer receiving the shipment.
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU shipped.
  - name: warehouse_key
    type: INTEGER
    foreign_key: mro_distributor.dim_warehouse.warehouse_key
    description: Warehouse that shipped the line.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity of the transaction.
  - name: qty_shipped
    type: INTEGER
    description: Units shipped.
  - name: order_to_ship_days
    type: INTEGER
    description: Days between order date and ship date — the fulfillment lead
      time. Averages ~2 days for items from reliable suppliers, ~7 days for items
      from tier-D suppliers.
- name: o2c_return_line
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per customer return line (~3% of order lines are returned).
  description: Customer returns with credited value and a coded reason (Damaged,
    Wrong Item, Overordered, Quality). Questions about returns, credits, or
    product quality complaints resolve here. Query as
    mro_distributor.o2c_return_line.
  columns:
  - name: return_line_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each return line.
  - name: return_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the return was received (YYYYMMDD key into dim_date).
  - name: customer_key
    type: INTEGER
    foreign_key: mro_distributor.dim_customer.customer_key
    description: Customer making the return.
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU returned.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity of the transaction.
  - name: qty_returned
    type: INTEGER
    description: Units returned.
  - name: credit_amount
    type: DECIMAL
    description: Credit issued to the customer in USD.
  - name: reason
    type: VARCHAR
    description: Coded reason for the return.
    values:
    - Damaged
    - Wrong Item
    - Overordered
    - Quality
- name: ar_invoice
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per customer invoice, issued at ship date (one invoice per
    fulfillment line).
  description: Accounts Receivable invoices — the billing record and the source
    of DSO. Invoices are cut at ship date, so fulfillment delay pushes billing
    later. open_balance is nonzero for invoices still unpaid at the end of loaded
    history. Query as mro_distributor.ar_invoice.
  columns:
  - name: invoice_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each invoice.
  - name: invoice_number
    type: VARCHAR
    description: Human-readable invoice number (e.g., INV-000123).
  - name: invoice_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the invoice was issued — equals the ship date (YYYYMMDD key).
  - name: due_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Payment due date per the customer's credit terms (YYYYMMDD key).
  - name: customer_key
    type: INTEGER
    foreign_key: mro_distributor.dim_customer.customer_key
    description: Customer billed.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity issuing the invoice.
  - name: invoice_amount
    type: DECIMAL
    description: Invoice total in USD.
  - name: open_balance
    type: DECIMAL
    description: Unpaid amount remaining in USD. Zero for fully paid invoices;
      equals invoice_amount for invoices not yet paid at end of history.
- name: ar_payment_application
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per payment applied to an invoice (invoices unpaid at end of
    history have no payment row).
  description: Customer payments applied against invoices. days_to_pay measures
    invoice-to-cash speed per payment and is the basis for DSO (~44 days weighted).
    About 15% of customers are chronic slow payers averaging ~20 days past terms —
    the second, customer-driven cash-delay signal alongside the supplier-driven
    one. Query as mro_distributor.ar_payment_application.
  columns:
  - name: ar_payment_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each payment application.
  - name: invoice_key
    type: BIGINT
    foreign_key: mro_distributor.ar_invoice.invoice_key
    description: The invoice this payment settles.
  - name: payment_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date payment was received (YYYYMMDD key into dim_date).
  - name: customer_key
    type: INTEGER
    foreign_key: mro_distributor.dim_customer.customer_key
    description: Paying customer.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity receiving payment.
  - name: amount_applied
    type: DECIMAL
    description: Amount applied to the invoice in USD.
  - name: days_to_pay
    type: INTEGER
    description: Days from invoice date to payment date — the per-invoice
      collection time.
- name: p2p_purchase_order_line
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per purchase order line placed with a supplier.
  description: Procure-to-Pay purchase order lines — what the distributor bought,
    from whom, and how late it arrived. late_days (received minus promised date)
    is the planted supplier-reliability signal, rising from ~0 days for tier-A
    suppliers to ~15 days for tier-D. Supplier spend and delivery performance
    questions start here. Query as mro_distributor.p2p_purchase_order_line.
  columns:
  - name: po_line_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each PO line.
  - name: po_number
    type: VARCHAR
    description: Human-readable purchase order number (e.g., PO-000123).
  - name: po_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the PO was placed (YYYYMMDD key into dim_date).
  - name: promised_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Contractual delivery date (PO date + supplier promised lead time).
  - name: received_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date goods were actually received.
  - name: supplier_key
    type: INTEGER
    foreign_key: mro_distributor.dim_supplier.supplier_key
    description: Supplier the PO was placed with.
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU purchased. Each SKU has a single assigned supplier, so
      distinct (item_key, supplier_key) pairs map items to their source supplier.
  - name: warehouse_key
    type: INTEGER
    foreign_key: mro_distributor.dim_warehouse.warehouse_key
    description: Receiving warehouse.
  - name: employee_key
    type: INTEGER
    foreign_key: mro_distributor.dim_employee.employee_key
    description: Buyer who placed the PO.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity making the purchase.
  - name: qty_ordered
    type: INTEGER
    description: Units ordered.
  - name: unit_cost
    type: DECIMAL
    description: Cost per unit in USD.
  - name: ext_cost
    type: DECIMAL
    description: Extended cost (unit_cost × qty_ordered) — the spend value of the
      line.
  - name: late_days
    type: INTEGER
    description: Days received after promised date (0 = on time). The planted
      supplier-reliability signal — averages ~0.1d for tier A up to ~15d for
      tier D.
- name: p2p_vendor_bill
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per vendor bill, issued at goods receipt (one bill per PO line).
  description: Supplier bills owed by the distributor — the Accounts Payable
    record and the source of DPO. open_balance is nonzero for bills unpaid at the
    end of loaded history. Query as mro_distributor.p2p_vendor_bill.
  columns:
  - name: bill_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each vendor bill.
  - name: bill_number
    type: VARCHAR
    description: Human-readable bill number (e.g., VB-000123).
  - name: bill_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Bill date — equals the goods receipt date (YYYYMMDD key).
  - name: due_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Due date per the supplier's payment terms (YYYYMMDD key).
  - name: supplier_key
    type: INTEGER
    foreign_key: mro_distributor.dim_supplier.supplier_key
    description: Supplier owed.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity that owes the bill.
  - name: bill_amount
    type: DECIMAL
    description: Bill total in USD.
  - name: open_balance
    type: DECIMAL
    description: Unpaid amount remaining in USD. Zero for fully paid bills.
- name: p2p_bill_payment
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per payment made against a vendor bill (bills unpaid at end of
    history have no payment row).
  description: Payments the distributor made to suppliers. days_to_pay is the
    basis for DPO (~39 days weighted) — how long the company holds cash before
    paying vendors. Query as mro_distributor.p2p_bill_payment.
  columns:
  - name: bill_payment_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each bill payment.
  - name: bill_key
    type: BIGINT
    foreign_key: mro_distributor.p2p_vendor_bill.bill_key
    description: The vendor bill this payment settles.
  - name: payment_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Date the payment was made (YYYYMMDD key into dim_date).
  - name: supplier_key
    type: INTEGER
    foreign_key: mro_distributor.dim_supplier.supplier_key
    description: Supplier paid.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity making the payment.
  - name: amount_paid
    type: DECIMAL
    description: Amount paid in USD.
  - name: days_to_pay
    type: INTEGER
    description: Days from bill date to payment date — the per-bill payment lag.
- name: inv_balance_snapshot
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per item × warehouse × day for actively stocked pairs (~1,810
    pairs, daily for 18 months — the largest table at ~971K rows).
  description: Daily inventory position — quantity and value on hand per SKU per
    warehouse, with an explicit stockout flag. The source of inventory value, DIO,
    and stockout-rate metrics. Stockouts concentrate in items sourced from
    unreliable (tier C/D) suppliers — the middle link of the supplier→cash chain.
    Query as mro_distributor.inv_balance_snapshot.
  columns:
  - name: snapshot_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each snapshot row.
  - name: snapshot_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Snapshot date (YYYYMMDD key into dim_date).
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU measured.
  - name: warehouse_key
    type: INTEGER
    foreign_key: mro_distributor.dim_warehouse.warehouse_key
    description: The stocking warehouse.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity owning the stock.
  - name: qty_on_hand
    type: INTEGER
    description: Units on hand at end of day.
  - name: value_on_hand
    type: DECIMAL
    description: Inventory value at cost in USD (qty_on_hand × unit cost).
  - name: is_stockout
    type: BOOLEAN
    description: True when qty_on_hand is zero — the stockout signal, ~3% of
      item-days for reliable-supplier items rising to ~13% for tier-D-sourced
      items.
- name: inv_transaction
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per inventory movement (receipts from POs, issues from
    shipments).
  description: Inventory movement ledger — signed quantity and value deltas for
    receipts and issues. Complements the daily snapshot with transaction-level
    traceability, including which supplier a receipt came from. Query as
    mro_distributor.inv_transaction.
  columns:
  - name: inv_txn_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each inventory transaction.
  - name: txn_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Transaction date (YYYYMMDD key into dim_date).
  - name: item_key
    type: INTEGER
    foreign_key: mro_distributor.dim_item.item_key
    description: The SKU moved.
  - name: warehouse_key
    type: INTEGER
    foreign_key: mro_distributor.dim_warehouse.warehouse_key
    description: Warehouse where the movement occurred.
  - name: supplier_key
    type: INTEGER
    nullable: true
    foreign_key: mro_distributor.dim_supplier.supplier_key
    description: Source supplier for receipts; null for issues.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity of the movement.
  - name: txn_type
    type: VARCHAR
    description: 'Movement type: Receipt (goods in from supplier), Issue (goods
      out to customer), Adjustment, or Transfer.'
    values:
    - Receipt
    - Issue
    - Adjustment
    - Transfer
  - name: qty_delta
    type: INTEGER
    description: Signed unit change — positive for receipts, negative for issues.
  - name: value_delta
    type: DECIMAL
    description: Signed value change at cost in USD.
- name: gl_journal_line
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per journal line. Revenue/AR lines post at invoice (ship) date;
    COGS/Inventory lines post at ship date.
  description: General ledger journal lines — the double-entry accounting record
    generated from billing and shipment flows. Debits and credits by account; the
    accounting source of truth for revenue and COGS trends. Query as
    mro_distributor.gl_journal_line.
  columns:
  - name: je_line_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each journal line.
  - name: je_number
    type: VARCHAR
    description: Journal entry number (e.g., JE-0000123).
  - name: posting_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Posting date (YYYYMMDD key into dim_date).
  - name: gl_account_key
    type: INTEGER
    foreign_key: mro_distributor.dim_gl_account.gl_account_key
    description: GL account posted to.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity of the posting.
  - name: employee_key
    type: INTEGER
    foreign_key: mro_distributor.dim_employee.employee_key
    description: Employee associated with the posting.
  - name: debit_amount
    type: DECIMAL
    description: Debit amount in USD (zero for credit lines).
  - name: credit_amount
    type: DECIMAL
    description: Credit amount in USD (zero for debit lines).
  - name: net_amount
    type: DECIMAL
    description: Debit minus credit — negative for net-credit lines such as
      revenue postings.
- name: gl_account_balance
  tenant: mro
  schema: mro_distributor
  type: fact
  grain: One row per GL account per month (period balance and running YTD).
  description: Monthly GL account balances rolled up from journal lines — the
    fastest path to revenue and COGS by period without aggregating raw journal
    lines. Sign convention follows net_amount, so revenue balances are negative
    (credit) and are negated for reporting. Query as
    mro_distributor.gl_account_balance.
  columns:
  - name: balance_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each balance row.
  - name: period_date_key
    type: INTEGER
    foreign_key: mro_distributor.dim_date.date_key
    description: Period marker date near month end (YYYYMMDD key into dim_date).
  - name: gl_account_key
    type: INTEGER
    foreign_key: mro_distributor.dim_gl_account.gl_account_key
    description: GL account the balance belongs to.
  - name: subsidiary_key
    type: INTEGER
    foreign_key: mro_distributor.dim_subsidiary.subsidiary_key
    description: Legal entity of the balance.
  - name: period_balance
    type: DECIMAL
    description: Net activity for the month (debits minus credits) in USD.
  - name: ytd_balance
    type: DECIMAL
    description: Running year-to-date balance in USD.
- name: dim_date
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per calendar day (2025-05-01 to 2026-10-22 plus settle-date run-off).
  description: Conformed calendar. Join any *_date_key column to dim_date.date_key (YYYYMMDD).
    Use month_num/year_num/quarter_num for periods and is_business_day for business-day logic.
    Query as harborline.dim_date.
  columns:
  - name: date_key
    type: INTEGER
    primary_key: true
    description: Surrogate date key in YYYYMMDD form; every *_date_key column in the fact tables
      joins here.
  - name: full_date
    type: DATE
    description: Full date.
  - name: day_of_week
    type: VARCHAR
    description: Day of week.
  - name: is_business_day
    type: BOOLEAN
    description: True on business days; failed-day, notice-window and penalty counting use business
      days.
  - name: day_of_month
    type: INTEGER
    description: Day of month.
  - name: week_of_year
    type: INTEGER
    description: Week of year.
  - name: month_num
    type: INTEGER
    description: Month num.
  - name: month_name
    type: VARCHAR
    description: Month name.
  - name: quarter_num
    type: INTEGER
    description: Quarter num.
  - name: fiscal_period
    type: VARCHAR
    description: '''FY26-Q2'''
  - name: year_num
    type: INTEGER
    description: Year num.
  - name: is_month_end
    type: BOOLEAN
    description: True on the last calendar day of the month.
- name: dim_market
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per market (12 markets).
  description: 'Markets Harborline settles in: CSD, settlement cycle, penalty regime (CSDR /
    CREST / NONE) and tax-reclaim complexity (LOW/MEDIUM/HIGH). Drives penalties (POL-002) and
    reclaim leakage (POL-005). Query as harborline.dim_market.'
  columns:
  - name: market_key
    type: INTEGER
    primary_key: true
    description: Market key.
  - name: market_code
    type: VARCHAR
    description: 'Two-letter market code: US, GB, DE, FR, IT, NL, CH, JP, HK, AU, CA, SG.'
  - name: market_name
    type: VARCHAR
    description: Market name.
  - name: csd_name
    type: VARCHAR
    description: DTC, CREST, Clearstream, Euroclear France...
  - name: region
    type: VARCHAR
    description: Americas / EMEA / APAC
  - name: settlement_cycle
    type: VARCHAR
    description: T+1 / T+2
  - name: penalty_regime
    type: VARCHAR
    description: 'Cash-penalty regime: CSDR (DE, FR, IT, NL), CREST (GB) or NONE (all others).
      No penalties exist in NONE markets.'
  - name: partial_settlement_allowed
    type: BOOLEAN
    description: Partial settlement allowed.
  - name: local_currency
    type: VARCHAR
    description: Local currency.
  - name: tax_reclaim_complexity
    type: VARCHAR
    description: 'Tax-reclaim documentation burden: LOW / MEDIUM / HIGH (FR, IT, CH are HIGH).
      Unfiled reclaim rates are highest in HIGH markets.'
- name: dim_security
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per security (800 securities).
  description: 'Securities held in custody: type (EQUITY/GOVT_BOND/CORP_BOND/ETF/MMI), issuer,
    listing market, income frequency and liquidity tier (LOW-liquidity securities fail more).
    Query as harborline.dim_security.'
  columns:
  - name: security_key
    type: INTEGER
    primary_key: true
    description: Security key.
  - name: isin
    type: VARCHAR
    description: Isin.
  - name: security_name
    type: VARCHAR
    description: Security name.
  - name: security_type
    type: VARCHAR
    description: 'Instrument class: EQUITY, GOVT_BOND, CORP_BOND, ETF or MMI. Drives CSDR penalty
      rate and fail rate (CORP_BOND fails most).'
  - name: issuer_name
    type: VARCHAR
    description: Issuer name.
  - name: issuer_country
    type: VARCHAR
    description: Issuer country.
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: local_currency
    type: VARCHAR
    description: Local currency.
  - name: income_frequency
    type: VARCHAR
    description: NONE / ANNUAL / SEMI_ANNUAL / QUARTERLY
  - name: liquidity_tier
    type: VARCHAR
    description: HIGH / MEDIUM / LOW; LOW-liquidity securities fail more often.
- name: dim_client
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per institutional client (50 clients).
  description: Harborline's custody clients with segment and SLA tier (PLATINUM/GOLD/SILVER).
    sla_tier selects the contractual targets in POL-001; client_segment drives pricing (POL-010)
    and reclaim eligibility (POL-005). Query as harborline.dim_client.
  columns:
  - name: client_key
    type: INTEGER
    primary_key: true
    description: Client key.
  - name: client_name
    type: VARCHAR
    description: Client name.
  - name: client_segment
    type: VARCHAR
    description: ASSET_MANAGER, PENSION_FUND, INSURANCE, SOVEREIGN_WEALTH or HEDGE_FUND. Drives
      pricing and treaty/reclaim eligibility; hedge funds are generally not reclaim-eligible.
  - name: domicile_country
    type: VARCHAR
    description: Domicile country.
  - name: sla_tier
    type: VARCHAR
    description: PLATINUM / GOLD / SILVER. Selects the contractual settlement-rate target and
      response times in POL-001 section 2 (99% / 98% / 97%).
  - name: onboarded_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the onboarded date; joins to dim_date.date_key.
  - name: relationship_manager
    type: VARCHAR
    description: Relationship manager.
  - name: base_currency
    type: VARCHAR
    description: Base currency.
- name: dim_counterparty
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per trading counterparty (60).
  description: Brokers, banks, custodians and clearing members Harborline settles against. reliability_tier
    A (reliable) to D (chronic fails) is the planted driver of fail rates and penalties; tier
    definitions are in POL-007. Query as harborline.dim_counterparty.
  columns:
  - name: counterparty_key
    type: INTEGER
    primary_key: true
    description: Counterparty key.
  - name: counterparty_name
    type: VARCHAR
    description: Counterparty name.
  - name: counterparty_type
    type: VARCHAR
    description: BROKER_DEALER / BANK / CUSTODIAN / CLEARING_MEMBER
  - name: region
    type: VARCHAR
    description: Region.
  - name: reliability_tier
    type: VARCHAR
    description: A (reliable) to D (chronic fails). Fail rate by tier is about 1% / 2.5% / 7%
      / 14%.
  - name: is_affiliated
    type: BOOLEAN
    description: True for Harborline group entities; tiered on the same criteria with no exemption
      (POL-007 section 5).
- name: dim_subcustodian
  tenant: harborline
  schema: harborline
  type: dimension
  grain: 'One row per subcustodian (16): one PRIMARY per market plus BACKUP for US/GB/DE/JP.'
  description: Local agent banks Harborline uses to hold and settle in each market. Query as
    harborline.dim_subcustodian.
  columns:
  - name: subcustodian_key
    type: INTEGER
    primary_key: true
    description: Subcustodian key.
  - name: subcustodian_name
    type: VARCHAR
    description: Subcustodian name.
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: service_tier
    type: VARCHAR
    description: PRIMARY or BACKUP subcustodian for the market.
  - name: contract_start_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the contract start date; joins to dim_date.date_key.
- name: dim_currency
  tenant: harborline
  schema: harborline
  type: dimension
  grain: One row per currency (9).
  description: Currencies with a simplified period-average USD rate. All fact amounts are in
    USD already; *_local columns keep the local-currency value. Query as harborline.dim_currency.
  columns:
  - name: currency_key
    type: INTEGER
    primary_key: true
    description: Currency key.
  - name: currency_code
    type: VARCHAR
    description: USD, EUR, GBP, JPY, HKD, AUD, CAD, CHF, SGD
  - name: currency_name
    type: VARCHAR
    description: Currency name.
  - name: usd_rate
    type: DECIMAL(12,6)
    description: units per USD, period-average (simplified)
- name: stl_trade_instruction
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per settlement instruction (one side of one trade); 540,000 rows.
  description: 'Settlement instructions: intended vs actual settle date, status (SETTLED/FAILED/PENDING/CANCELLED),
    fail reason and days_failed. The source of settlement rate, fail rate, aged fails and counterparty
    fail analysis. FAILED rows always have days_failed >= 1; settled rows have days_failed =
    0. Fail rate = FAILED / (SETTLED + FAILED). Query as harborline.stl_trade_instruction.'
  columns:
  - name: instruction_key
    type: BIGINT
    primary_key: true
    description: Unique identifier for each settlement instruction.
  - name: instruction_ref
    type: VARCHAR
    description: Instruction ref.
  - name: trade_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the trade date; joins to dim_date.date_key.
  - name: intended_settle_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Intended settlement date (ISD). Settlement-rate periods are assigned by this
      date.
  - name: actual_settle_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date the instruction actually settled; NULL while unsettled. Equal to intended
      date for on-time settlements.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: counterparty_key
    type: INTEGER
    foreign_key: harborline.dim_counterparty.counterparty_key
    description: Foreign key to dim_counterparty (counterparty_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: subcustodian_key
    type: INTEGER
    foreign_key: harborline.dim_subcustodian.subcustodian_key
    description: Foreign key to dim_subcustodian (subcustodian_key).
  - name: currency_key
    type: INTEGER
    foreign_key: harborline.dim_currency.currency_key
    description: Foreign key to dim_currency (currency_key).
  - name: direction
    type: VARCHAR
    description: RECEIVE (securities in, cash out) or DELIVER (securities out, cash in). Failed
      receives create client overdrafts.
  - name: quantity
    type: BIGINT
    description: Quantity.
  - name: settlement_amount_local
    type: DECIMAL(18,2)
    description: Settlement amount local.
  - name: settlement_amount_usd
    type: DECIMAL(18,2)
    description: Cash value of the instruction in USD; the basis for CSDR penalties.
  - name: settlement_status
    type: VARCHAR
    description: SETTLED, FAILED, PENDING (not yet due) or CANCELLED. A FAILED instruction missed
      its intended date (it may have settled later; actual_settle_date_key then has a value).
  - name: fail_reason_code
    type: VARCHAR
    description: 'NULL when settled: LACK_OF_SECURITIES / LACK_OF_CASH / MISMATCHED_INSTRUCTION
      / COUNTERPARTY_INSTRUCTION_MISSING / MARKET_RESTRICTION / LATE_MATCHING'
  - name: days_failed
    type: INTEGER
    description: Business days settlement was late; 0 when settled on the intended date. Aged
      fail = 5 or more (POL-006 section 3).
  - name: is_matched_on_time
    type: BOOLEAN
    description: Is matched on time.
- name: stl_fail_penalty
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per failed instruction per penalty day (CSDR/CREST penalties accrue daily);
    ~39K rows. Only CSDR/CREST markets have rows.
  description: Daily cash penalties on failed instructions, with the bearer (CLIENT / HARBORLINE
    / COUNTERPARTY) that decides who pays (POL-002 section 5). Join to stl_trade_instruction
    on instruction_key. Query as harborline.stl_fail_penalty.
  columns:
  - name: penalty_key
    type: BIGINT
    primary_key: true
    description: Penalty key.
  - name: instruction_key
    type: BIGINT
    foreign_key: harborline.stl_trade_instruction.instruction_key
    description: The failed instruction this daily penalty accrued on.
  - name: penalty_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the penalty date; joins to dim_date.date_key.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: counterparty_key
    type: INTEGER
    foreign_key: harborline.dim_counterparty.counterparty_key
    description: Foreign key to dim_counterparty (counterparty_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: penalty_type
    type: VARCHAR
    description: SEFP (settlement fail) or LMFP (late matching).
  - name: penalty_regime
    type: VARCHAR
    description: CSDR / CREST
  - name: penalty_rate_bps
    type: DECIMAL(8,4)
    description: daily rate applied
  - name: penalty_amount_usd
    type: DECIMAL(14,2)
    description: Cash penalty for this instruction-day in USD (settlement value x daily bps
      / 10,000).
  - name: bearer
    type: VARCHAR
    description: 'Who bears the penalty: CLIENT (passed through), HARBORLINE (operational loss)
      or COUNTERPARTY (claimed back). See POL-002 section 5.'
- name: pos_daily_position
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per client / security / market / day (1.08M rows, ~2,000 client-security pairs).
  description: Daily holdings and market value. Assets under custody (AUC) = SUM(market_value_usd)
    on one date; never sum across dates. quantity_pending is stuck in failed settlement. Query
    as harborline.pos_daily_position.
  columns:
  - name: position_key
    type: BIGINT
    primary_key: true
    description: Position key.
  - name: position_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the position date; joins to dim_date.date_key.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: subcustodian_key
    type: INTEGER
    foreign_key: harborline.dim_subcustodian.subcustodian_key
    description: Foreign key to dim_subcustodian (subcustodian_key).
  - name: currency_key
    type: INTEGER
    foreign_key: harborline.dim_currency.currency_key
    description: Foreign key to dim_currency (currency_key).
  - name: quantity_settled
    type: BIGINT
    description: Quantity settled.
  - name: quantity_pending
    type: BIGINT
    description: stuck in failed settlement
  - name: market_value_local
    type: DECIMAL(18,2)
    description: Market value local.
  - name: market_value_usd
    type: DECIMAL(18,2)
    description: Position market value in USD on that date. AUC = SUM on a single date.
- name: pos_cash_balance
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per client / currency / business day.
  description: Daily client cash balances. is_overdrawn rows carry overdraft_amount_usd and
    the overnight funding_cost_usd Harborline incurs funding the shortfall (mostly caused by
    failed receives, POL-011). Query as harborline.pos_cash_balance.
  columns:
  - name: cash_balance_key
    type: BIGINT
    primary_key: true
    description: Cash balance key.
  - name: balance_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the balance date; joins to dim_date.date_key.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: currency_key
    type: INTEGER
    foreign_key: harborline.dim_currency.currency_key
    description: Foreign key to dim_currency (currency_key).
  - name: opening_balance_usd
    type: DECIMAL(18,2)
    description: Opening balance usd.
  - name: closing_balance_usd
    type: DECIMAL(18,2)
    description: Closing balance usd.
  - name: is_overdrawn
    type: BOOLEAN
    description: True when the closing balance is negative; caused mostly by failed receives.
  - name: overdraft_amount_usd
    type: DECIMAL(18,2)
    description: Overdraft amount usd.
  - name: funding_cost_usd
    type: DECIMAL(14,2)
    description: Overnight cost Harborline incurs funding the overdraft (benchmark + 150 bps
      / 360).
- name: cae_event
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per corporate action event per security (~3,350 events).
  description: Corporate action events with the announcement-to-deadline notice window. Voluntary
    events need a client election; notice_window_days is NULL for mandatory events. Query as
    harborline.cae_event.
  columns:
  - name: event_key
    type: BIGINT
    primary_key: true
    description: Event key.
  - name: event_ref
    type: VARCHAR
    description: Event ref.
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: event_type
    type: VARCHAR
    description: CASH_DIVIDEND / COUPON / STOCK_SPLIT / RIGHTS_ISSUE / TENDER_OFFER / MERGER
      / DIVIDEND_OPTION
  - name: is_voluntary
    type: BOOLEAN
    description: True when the event needs a client election.
  - name: announcement_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the announcement date; joins to dim_date.date_key.
  - name: record_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the record date; joins to dim_date.date_key.
  - name: response_deadline_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the response deadline date; joins to dim_date.date_key.
  - name: payment_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the payment date; joins to dim_date.date_key.
  - name: notice_window_days
    type: INTEGER
    description: Days between announcement and response deadline (voluntary events only). 2
      or fewer = short-notice (POL-004 section 5); the strongest predictor of missed elections.
  - name: gross_rate_per_share
    type: DECIMAL(14,6)
    description: Gross rate per share.
- name: cae_client_election
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per client per voluntary event they are entitled to (~2,670 rows).
  description: Client elections on voluntary events. missed_deadline = true is a Harborline
    error (POL-004 section 7) with estimated_client_impact_usd as the compensation exposure
    (capped at USD 5M). Query as harborline.cae_client_election.
  columns:
  - name: election_key
    type: BIGINT
    primary_key: true
    description: Election key.
  - name: event_key
    type: BIGINT
    foreign_key: harborline.cae_event.event_key
    description: Foreign key to cae_event (event_key).
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: entitled_quantity
    type: BIGINT
    description: Entitled quantity.
  - name: election_status
    type: VARCHAR
    description: ELECTED, DEFAULTED (no instruction received - not an error) or MISSED_DEADLINE
      (Harborline error).
  - name: elected_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the elected date; joins to dim_date.date_key.
  - name: deadline_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the deadline date; joins to dim_date.date_key.
  - name: hours_before_deadline
    type: INTEGER
    description: negative when missed
  - name: missed_deadline
    type: BOOLEAN
    description: True when Harborline failed to transmit the client's instruction before the
      market deadline - a Harborline error.
  - name: estimated_client_impact_usd
    type: DECIMAL(14,2)
    description: Compensation exposure for a missed election (0.1-1% of position value, capped
      at USD 5M); 0 when not missed.
- name: cae_income_payment
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per income payment per client per event.
  description: 'Dividend/coupon income collected: timeliness (days_late), withholding tax, and
    tax-reclaim eligibility/filing. Unfiled eligible reclaims (reclaim_eligible AND NOT reclaim_filed)
    are the leakage. Query as harborline.cae_income_payment.'
  columns:
  - name: income_payment_key
    type: BIGINT
    primary_key: true
    description: Income payment key.
  - name: event_key
    type: BIGINT
    foreign_key: harborline.cae_event.event_key
    description: Foreign key to cae_event (event_key).
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: currency_key
    type: INTEGER
    foreign_key: harborline.dim_currency.currency_key
    description: Foreign key to dim_currency (currency_key).
  - name: expected_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the expected date; joins to dim_date.date_key.
  - name: actual_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the actual date; joins to dim_date.date_key.
  - name: days_late
    type: INTEGER
    description: Business days between expected and actual receipt; 0 = on time.
  - name: gross_amount_usd
    type: DECIMAL(16,2)
    description: Gross amount usd.
  - name: withholding_tax_usd
    type: DECIMAL(16,2)
    description: Withholding tax usd.
  - name: net_amount_usd
    type: DECIMAL(16,2)
    description: Net amount usd.
  - name: statutory_rate_pct
    type: DECIMAL(6,3)
    description: rate actually withheld
  - name: treaty_rate_pct
    type: DECIMAL(6,3)
    description: rate the client is entitled to
  - name: reclaim_eligible
    type: BOOLEAN
    description: True when statutory withholding exceeds the client's treaty rate and the client
      type qualifies.
  - name: reclaim_filed
    type: BOOLEAN
    description: True when Harborline filed the tax reclaim. Eligible but unfiled = leakage.
  - name: reclaim_amount_usd
    type: DECIMAL(16,2)
    description: 'Recoverable tax: gross income x (statutory - treaty rate). The value at stake
      when unfiled.'
  - name: reclaim_deadline_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: statute of limitations. Date key (YYYYMMDD) of the reclaim deadline date; joins
      to dim_date.date_key.
- name: clt_fee_invoice
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per client / month / fee type (Oct 2026 not invoiced).
  description: Monthly fee invoices. billable_amount_usd is the standard-rate fee; invoiced_amount_usd
    is what was charged after waiver or cap. The difference is revenue foregone, by waiver_reason
    (POL-010 section 5). Query as harborline.clt_fee_invoice.
  columns:
  - name: fee_invoice_key
    type: BIGINT
    primary_key: true
    description: Fee invoice key.
  - name: invoice_ref
    type: VARCHAR
    description: Invoice ref.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: period_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Month-end date of the billing period.
  - name: fee_type
    type: VARCHAR
    description: CUSTODY_BPS / TRANSACTION / CORPORATE_ACTION / INCOME_COLLECTION / TAX_RECLAIM
      / OVERDRAFT
  - name: basis_amount_usd
    type: DECIMAL(18,2)
    description: AUC or transaction count basis
  - name: fee_rate
    type: DECIMAL(10,6)
    description: Fee rate.
  - name: billable_amount_usd
    type: DECIMAL(16,2)
    description: Billable amount usd.
  - name: invoiced_amount_usd
    type: DECIMAL(16,2)
    description: Amount actually charged (revenue). Revenue foregone = billable - invoiced.
  - name: waiver_reason
    type: VARCHAR
    description: 'Why invoiced is below billable: SLA_CREDIT, RELATIONSHIP_DISCOUNT or FEE_CAP;
      NULL when none.'
- name: clt_service_request
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per client service request (~5,300 rows).
  description: Client service requests with SLA target, breach flag and analyst_hours (cost-to-serve
    driver, costed at USD 85/hour in POL-010 section 6). Query as harborline.clt_service_request.
  columns:
  - name: service_request_key
    type: BIGINT
    primary_key: true
    description: Service request key.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: raised_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the raised date; joins to dim_date.date_key.
  - name: resolved_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the resolved date; joins to dim_date.date_key.
  - name: request_category
    type: VARCHAR
    description: FAIL_QUERY / INCOME_QUERY / CORPORATE_ACTION_QUERY / REPORTING / RECONCILIATION
      / ONBOARDING
  - name: priority
    type: VARCHAR
    description: P1 / P2 / P3
  - name: resolution_hours
    type: DECIMAL(10,2)
    description: Resolution hours.
  - name: sla_target_hours
    type: INTEGER
    description: from the client's SLA tier
  - name: sla_breached
    type: BOOLEAN
    description: True when resolution_hours exceeded the tier target for the priority.
  - name: analyst_hours
    type: DECIMAL(8,2)
    description: Analyst effort on the request; costed at USD 85/hour in client profitability.
- name: rec_break
  tenant: harborline
  schema: harborline
  type: fact
  grain: One row per reconciliation break (~5,400 rows).
  description: Reconciliation breaks between Harborline's books and subcustodian statements,
    with age and root cause. Open breaks aged 10+ days are escalated (POL-009 section 4). Query
    as harborline.rec_break.
  columns:
  - name: break_key
    type: BIGINT
    primary_key: true
    description: Break key.
  - name: break_ref
    type: VARCHAR
    description: Break ref.
  - name: detected_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the detected date; joins to dim_date.date_key.
  - name: resolved_date_key
    type: INTEGER
    foreign_key: harborline.dim_date.date_key
    description: Date key (YYYYMMDD) of the resolved date; joins to dim_date.date_key.
  - name: client_key
    type: INTEGER
    foreign_key: harborline.dim_client.client_key
    description: Foreign key to dim_client (client_key).
  - name: security_key
    type: INTEGER
    foreign_key: harborline.dim_security.security_key
    description: Foreign key to dim_security (security_key).
  - name: market_key
    type: INTEGER
    foreign_key: harborline.dim_market.market_key
    description: Foreign key to dim_market (market_key).
  - name: subcustodian_key
    type: INTEGER
    foreign_key: harborline.dim_subcustodian.subcustodian_key
    description: Foreign key to dim_subcustodian (subcustodian_key).
  - name: break_type
    type: VARCHAR
    description: CASH / POSITION / TRANSACTION
  - name: break_amount_usd
    type: DECIMAL(16,2)
    description: Break amount usd.
  - name: age_days
    type: INTEGER
    description: Business days from detection to resolution (or to today if still open). Aged
      = 10+ (POL-009 section 4).
  - name: break_status
    type: VARCHAR
    description: OPEN, RESOLVED or WRITTEN_OFF.
  - name: root_cause
    type: VARCHAR
    description: FAILED_SETTLEMENT, CORPORATE_ACTION, FX, TIMING or UNKNOWN; failed settlement
      is the most common.
